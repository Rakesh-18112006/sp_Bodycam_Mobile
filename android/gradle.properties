org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Works around a Kotlin Gradle Plugin bug where incremental compilation
# crashes (IllegalArgumentException: "this and base files have different
# roots") when a plugin's Kotlin sources (in the pub-cache, e.g. C:\Users\..)
# and the project (e.g. D:\...) live on different Windows drive letters --
# File.relativeTo() has no answer across drive roots. Encountered building
# this project with battery_plus (the first dependency here with real
# native Kotlin sources) on a machine where the Flutter/Pub cache and the
# project checkout are on different drives. Safe to remove if/when this
# project and the Pub cache always share a drive letter, or once the
# upstream Kotlin Gradle Plugin bug is fixed.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
